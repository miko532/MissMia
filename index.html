<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Miss Mia AI</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Google Tag Manager -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NE8QH6RTWG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-NE8QH6RTWG');
  </script>
  
  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body, #root {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      background-color: #0d0714;
      font-family: 'Outfit', sans-serif;
      color: #fdf2f8;
    }

    .scroll-touch {
      -webkit-overflow-scrolling: touch;
      overflow-y: auto;
    }

    /* تأثير ظل مربع بنك للصورة */
    .pink-box-shadow {
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.45);
      border: 1.5px solid rgba(244, 114, 182, 0.6);
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0d0714; }
    ::-webkit-scrollbar-thumb { background: #2d1847; border-radius: 4px; }
  </style>
</head>
<body class="selection:bg-pink-500 selection:text-white">

  <div id="root" class="w-full h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = "https://ai-w58g.onrender.com/api";
    axios.defaults.withCredentials = true;

    // رابط صورة فتاة شقراء أنمي بنظرة مسيطرة وجذابة
    const MIA_AVATAR = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80";

    axios.interceptors.request.use((config) => {
      const token = localStorage.getItem("token");
      if (token) {
        config.headers.Authorization = `Bearer ${token}`;
      }
      return config;
    }, (error) => Promise.reject(error));

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [authMode, setAuthMode] = useState('login');
      
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [authError, setAuthError] = useState('');

      const [conversations, setConversations] = useState([]);
      const [currentChatId, setCurrentChatId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputMessage, setInputMessage] = useState('');
      const [sending, setSending] = useState(false);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      
      const chatContainerRef = useRef(null);

      useEffect(() => {
        checkAuth();
      }, []);

      useEffect(() => {
        if (chatContainerRef.current) {
          chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
        }
      }, [messages, sending]);

      const checkAuth = async () => {
        try {
          const res = await axios.get(`${API_BASE}/auth/me`);
          if (res.data.user) {
            setUser(res.data.user);
            await loadInitialChats();
          }
        } catch (err) {
          setUser(null);
          localStorage.removeItem("token");
        } finally {
          setLoading(false);
        }
      };

      const loadInitialChats = async () => {
        try {
          const res = await axios.get(`${API_BASE}/chat/conversations`);
          setConversations(res.data || []);
          if (res.data && res.data.length > 0) {
            const firstId = res.data[0]._id;
            setCurrentChatId(firstId);
            const msgRes = await axios.get(`${API_BASE}/chat/conversations/${firstId}/messages`);
            setMessages(msgRes.data || []);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        try {
          const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
          const payload = authMode === 'login' 
            ? { email, password } 
            : { username, email, password };

          const res = await axios.post(`${API_BASE}${endpoint}`, payload);
          if (res.data.token) {
            localStorage.setItem("token", res.data.token);
          }
          setUser(res.data.user);
          await loadInitialChats();
        } catch (err) {
          setAuthError(err.response?.data?.message || 'حدث خطأ أثناء الاتصال بالخادم.');
        }
      };

      const handleLogout = async () => {
        try {
          await axios.post(`${API_BASE}/auth/logout`);
        } catch (err) {
          console.error(err);
        } finally {
          localStorage.removeItem("token");
          setUser(null);
          setConversations([]);
          setMessages([]);
          setCurrentChatId(null);
          setSidebarOpen(false);
        }
      };

      const createNewChat = async () => {
        try {
          const res = await axios.post(`${API_BASE}/chat/conversations`);
          setConversations(prev => [res.data, ...prev]);
          setCurrentChatId(res.data._id);
          setMessages([]);
          setSidebarOpen(false);
        } catch (err) {
          console.error(err);
        }
      };

      const selectConversation = async (id) => {
        setCurrentChatId(id);
        setSidebarOpen(false);
        try {
          const res = await axios.get(`${API_BASE}/chat/conversations/${id}/messages`);
          setMessages(res.data || []);
        } catch (err) {
          console.error(err);
        }
      };

      const deleteConversation = async (e, id) => {
        e.stopPropagation();
        try {
          await axios.delete(`${API_BASE}/chat/conversations/${id}`);
          const updated = conversations.filter(c => c._id !== id);
          setConversations(updated);
          if (currentChatId === id) {
            if (updated.length > 0) selectConversation(updated[0]._id);
            else { setCurrentChatId(null); setMessages([]); }
          }
        } catch (err) {
          console.error(err);
        }
      };

      const sendMessage = async (e, customText = null) => {
        if (e) e.preventDefault();
        const textToSend = customText || inputMessage;
        if (!textToSend.trim() || sending) return;

        let activeId = currentChatId;

        if (!activeId) {
          try {
            const res = await axios.post(`${API_BASE}/chat/conversations`);
            activeId = res.data._id;
            setCurrentChatId(activeId);
            setConversations(prev => [res.data, ...prev]);
          } catch (err) {
            return;
          }
        }

        setInputMessage('');
        setMessages(prev => [...prev, { role: 'user', content: textToSend }]);
        setSending(true);

        try {
          const res = await axios.post(`${API_BASE}/chat/conversations/${activeId}/messages`, {
            message: textToSend
          });
          
          setMessages(prev => [...prev, { role: 'assistant', content: res.data.message }]);
          
          if (typeof res.data.messagesLeft !== 'undefined') {
            setUser(prev => ({ ...prev, messagesLeft: res.data.messagesLeft }));
          }
        } catch (err) {
          const errMsg = err.response?.status === 403 
            ? (err.response?.data?.message || 'عذراً، لقد نفذ رصيد الرسائل.')
            : 'حدث خطأ في الاتصال.';
          setMessages(prev => [...prev, { role: 'assistant', content: errMsg }]);
        } finally {
          setSending(false);
        }
      };

      const activeChatTitle = conversations.find(c => c._id === currentChatId)?.title || "محادثة جديدة";

      if (loading) {
        return (
          <div className="flex-1 flex flex-col items-center justify-center bg-[#0d0714]">
            <div className="w-10 h-10 border-2 border-pink-500/20 border-t-pink-500 rounded-full animate-spin"></div>
            <p className="text-xs text-pink-300/60 mt-3">جاري التحميل...</p>
          </div>
        );
      }

      /* شاشة تسجيل الدخول */
      if (!user) {
        return (
          <div className="flex-1 flex items-center justify-center p-4 bg-[#0d0714] scroll-touch">
            <div className="w-full max-w-sm bg-[#130a1c] border border-purple-900/40 rounded-2xl p-6 shadow-lg">
              <div className="text-center mb-6">
                <div className="w-16 h-16 rounded-2xl overflow-hidden mx-auto mb-3 pink-box-shadow">
                  <img src={MIA_AVATAR} alt="Miss Mia" className="w-full h-full object-cover" />
                </div>
                <h1 className="text-xl font-bold text-white">Miss Mia <span className="text-pink-400">AI</span></h1>
                <p className="text-pink-300/50 text-xs mt-1">المساعد الذكي</p>
              </div>

              {authError && (
                <div className="bg-rose-950 border border-rose-600 text-rose-300 px-3 py-2 rounded-xl text-xs mb-3 text-center">
                  {authError}
                </div>
              )}

              <form onSubmit={handleAuth} className="space-y-3">
                {authMode === 'register' && (
                  <div>
                    <label className="block text-xs text-pink-200/70 mb-1">الاسم</label>
                    <input 
                      type="text" 
                      required 
                      value={username} 
                      onChange={e => setUsername(e.target.value)}
                      placeholder="اسمك"
                      className="w-full bg-[#1c0e2b] border border-purple-900/50 rounded-xl p-2.5 text-xs text-white placeholder-pink-300/30 focus:border-pink-500 outline-none"
                    />
                  </div>
                )}

                <div>
                  <label className="block text-xs text-pink-200/70 mb-1">البريد الإلكتروني</label>
                  <input 
                    type="email" 
                    required 
                    value={email} 
                    onChange={e => setEmail(e.target.value)}
                    placeholder="name@example.com"
                    className="w-full bg-[#1c0e2b] border border-purple-900/50 rounded-xl p-2.5 text-xs text-white placeholder-pink-300/30 focus:border-pink-500 outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs text-pink-200/70 mb-1">كلمة المرور</label>
                  <input 
                    type="password" 
                    required 
                    value={password} 
                    onChange={e => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-[#1c0e2b] border border-purple-900/50 rounded-xl p-2.5 text-xs text-white placeholder-pink-300/30 focus:border-pink-500 outline-none"
                  />
                </div>

                <button 
                  type="submit" 
                  className="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-2.5 rounded-xl text-xs transition mt-2 active:scale-95"
                >
                  {authMode === 'login' ? 'تسجيل الدخول' : 'إنشاء حساب'}
                </button>
              </form>

              <div className="mt-4 text-center">
                <button 
                  onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); }}
                  className="text-xs text-pink-400 hover:underline"
                >
                  {authMode === 'login' ? 'ليس لديك حساب؟ سجّل الآن' : 'لديك حساب؟ تسجيل الدخول'}
                </button>
              </div>
            </div>
          </div>
        );
      }

      /* شاشة الشات الرئيسية */
      return (
        <div className="relative w-full h-full flex overflow-hidden bg-[#0d0714]">
          
          {/* خلفية الإغلاق للموبايل */}
          {sidebarOpen && (
            <div 
              onClick={() => setSidebarOpen(false)} 
              className="fixed inset-0 bg-black/70 z-30 md:hidden"
            />
          )}

          {/* القائمة الجانبية (Sidebar) */}
          <aside className={`
            fixed top-0 bottom-0 right-0 z-40 w-64 bg-[#12091c] border-l border-purple-900/30 flex flex-col justify-between transition-transform duration-200 ease-out md:static md:translate-x-0
            ${sidebarOpen ? 'translate-x-0' : 'translate-x-full'}
          `}>
            <div className="flex flex-col h-full overflow-hidden">
              <div className="p-3 border-b border-purple-900/30 flex items-center justify-between bg-[#0e0717]">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-xl overflow-hidden pink-box-shadow">
                    <img src={MIA_AVATAR} alt="Miss Mia" className="w-full h-full object-cover" />
                  </div>
                  <span className="font-bold text-xs text-white">Miss Mia</span>
                </div>
                <button 
                  onClick={() => setSidebarOpen(false)}
                  className="md:hidden text-pink-300 p-1.5"
                >
                  <i className="fa-solid fa-xmark text-sm"></i>
                </button>
              </div>

              {/* الرصيد */}
              <div className="p-3">
                <div className="bg-[#1c0e2b] p-2.5 rounded-xl border border-purple-900/40 flex items-center justify-between text-xs">
                  <span className="text-pink-300">الرصيد المتبقي:</span>
                  <span className="font-bold text-pink-400 bg-pink-500/10 px-2 py-0.5 rounded-full border border-pink-500/20">
                    {user.messagesLeft ?? 0}
                  </span>
                </div>
              </div>

              {/* زر محادثة جديدة */}
              <div className="px-3 pb-2">
                <button 
                  onClick={createNewChat}
                  className="w-full bg-pink-600 hover:bg-pink-500 text-white py-2 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5"
                >
                  <i className="fa-solid fa-plus text-[10px]"></i>
                  <span>محادثة جديدة</span>
                </button>
              </div>

              {/* السجل */}
              <div className="flex-1 scroll-touch px-2 space-y-1">
                <div className="text-[10px] text-pink-300/40 px-2 py-1 font-semibold">المحادثات الأخيرة</div>
                {conversations.length === 0 ? (
                  <p className="text-center text-xs text-pink-300/30 py-4">لا توجد محادثات</p>
                ) : (
                  conversations.map(chat => (
                    <div 
                      key={chat._id}
                      onClick={() => selectConversation(chat._id)}
                      className={`flex items-center justify-between p-2 rounded-xl text-xs cursor-pointer transition ${
                        currentChatId === chat._id 
                          ? 'bg-pink-600/30 border border-pink-500/40 text-white font-bold' 
                          : 'text-pink-200/60 hover:bg-[#1c0e2b]'
                      }`}
                    >
                      <span className="truncate flex-1 pl-2">{chat.title || 'محادثة جديدة'}</span>
                      <button 
                        onClick={(e) => deleteConversation(e, chat._id)}
                        className="text-pink-400/50 hover:text-rose-400 p-1"
                      >
                        <i className="fa-regular fa-trash-can text-[11px]"></i>
                      </button>
                    </div>
                  ))
                )}
              </div>

              {/* تفاصيل الحساب */}
              <div className="p-3 border-t border-purple-900/30 bg-[#0e0717] flex items-center justify-between">
                <div className="truncate">
                  <p className="text-xs font-bold text-white truncate">{user.username}</p>
                  <p className="text-[10px] text-pink-300/40 truncate">{user.email}</p>
                </div>
                <button 
                  onClick={handleLogout}
                  className="text-pink-300 hover:text-rose-400 p-1.5"
                  title="خروج"
                >
                  <i className="fa-solid fa-arrow-right-from-bracket text-xs"></i>
                </button>
              </div>
            </div>
          </aside>

          {/* مساحة الشات */}
          <main className="flex-1 flex flex-col h-full overflow-hidden bg-[#0d0714]">
            
            {/* الهيدر العلوي */}
            <header className="h-14 bg-[#12091c] border-b border-purple-900/30 px-3 flex items-center justify-between shrink-0 z-10">
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setSidebarOpen(true)}
                  className="md:hidden w-8 h-8 rounded-lg bg-[#1c0e2b] border border-purple-900/40 text-pink-300 flex items-center justify-center"
                >
                  <i className="fa-solid fa-bars text-sm"></i>
                </button>

                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-xl overflow-hidden pink-box-shadow shrink-0">
                    <img src={MIA_AVATAR} alt="Miss Mia" className="w-full h-full object-cover" />
                  </div>
                  <div>
                    <h2 className="text-xs font-bold text-white">Miss Mia</h2>
                    <p className="text-[10px] text-pink-300/50 truncate max-w-[120px] sm:max-w-xs">{activeChatTitle}</p>
                  </div>
                </div>
              </div>

              <button 
                onClick={createNewChat} 
                className="bg-[#1c0e2b] border border-purple-900/40 text-pink-200 text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1"
              >
                <i className="fa-solid fa-plus text-[10px]"></i>
                <span className="text-[11px]">جديد</span>
              </button>
            </header>

            {/* رسائل الشات */}
            <div 
              ref={chatContainerRef} 
              className="flex-1 scroll-touch p-3 space-y-3"
            >
              {messages.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-center p-4">
                  <div className="w-20 h-20 rounded-2xl overflow-hidden pink-box-shadow mb-3">
                    <img src={MIA_AVATAR} alt="Miss Mia" className="w-full h-full object-cover" />
                  </div>
                  <h3 className="text-base font-bold text-white">أهلاً بك مع Miss Mia</h3>
                  <p className="text-xs text-pink-300/60 mt-1 max-w-xs">
                    تفضّل بالسؤال أو ابدأ بالرسالة الترحيبية أدناه.
                  </p>
                  <button 
                    onClick={() => sendMessage(null, 'هلا عمتي')}
                    className="mt-4 bg-[#1c0e2b] border border-pink-500/30 text-pink-200 text-xs px-4 py-2 rounded-xl flex items-center gap-2 active:scale-95 shadow"
                  >
                    <span>🌸</span>
                    <span>هلا عمتي</span>
                  </button>
                </div>
              ) : (
                messages.map((msg, idx) => {
                  const isUser = msg.role === 'user';
                  return (
                    <div 
                      key={idx} 
                      className={`flex items-start gap-2 max-w-[85%] sm:max-w-lg ${isUser ? 'mr-auto flex-row-reverse' : 'ml-auto'}`}
                    >
                      {/* الأفاتار لكل رسالة مع ظل بنك مربع لميا */}
                      {isUser ? (
                        <div className="w-7 h-7 rounded-lg bg-purple-950 text-pink-200 flex items-center justify-center text-[10px] shrink-0 mt-0.5 border border-purple-900/50">
                          <i className="fa-solid fa-user"></i>
                        </div>
                      ) : (
                        <div className="w-7 h-7 rounded-lg overflow-hidden pink-box-shadow shrink-0 mt-0.5">
                          <img src={MIA_AVATAR} alt="Mia" className="w-full h-full object-cover" />
                        </div>
                      )}

                      <div className={`p-2.5 rounded-2xl text-xs leading-relaxed ${
                        isUser 
                          ? 'bg-pink-600 text-white rounded-tl-none shadow' 
                          : 'bg-[#180d28] border border-purple-900/40 text-pink-50 rounded-tr-none'
                      }`}>
                        <p className="whitespace-pre-wrap">{msg.content}</p>
                      </div>
                    </div>
                  );
                })
              )}

              {sending && (
                <div className="flex items-center gap-2 ml-auto text-xs text-pink-300/60 p-2">
                  <div className="w-6 h-6 rounded-lg overflow-hidden pink-box-shadow shrink-0">
                    <img src={MIA_AVATAR} alt="Mia" className="w-full h-full object-cover" />
                  </div>
                  <span>Miss Mia تكتب الآن...</span>
                </div>
              )}
            </div>

            {/* شريط الإدخال */}
            <div className="p-2.5 bg-[#12091c] border-t border-purple-900/30 shrink-0">
              <form onSubmit={sendMessage} className="flex items-center gap-2 max-w-3xl mx-auto">
                <input 
                  type="text" 
                  value={inputMessage} 
                  onChange={e => setInputMessage(e.target.value)}
                  disabled={user.messagesLeft <= 0 || sending}
                  placeholder={user.messagesLeft <= 0 ? "نفذ رصيدك..." : "اكتب رسالتك..."}
                  className="flex-1 bg-[#180d28] border border-purple-900/50 rounded-xl py-2 px-3 text-xs text-pink-50 placeholder-pink-300/30 focus:outline-none focus:border-pink-500"
                />
                <button 
                  type="submit" 
                  disabled={!inputMessage.trim() || sending || user.messagesLeft <= 0}
                  className="w-8 h-8 bg-pink-600 hover:bg-pink-500 disabled:bg-purple-950 disabled:text-pink-300/20 text-white rounded-xl flex items-center justify-center shrink-0"
                >
                  <i className="fa-solid fa-paper-plane text-[11px]"></i>
                </button>
              </form>
            </div>

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
