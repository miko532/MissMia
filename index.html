<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Miss Mia AI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NE8QH6RTWG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-NE8QH6RTWG');
  </script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Outfit', sans-serif; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0f0a15; }
    ::-webkit-scrollbar-thumb { background: #261738; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b2257; }
  </style>
</head>
<body class="bg-[#0f0a15] text-pink-50 min-h-screen antialiased selection:bg-pink-400 selection:text-slate-950 overflow-hidden">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = "https://ai-w58g.onrender.com/api";
    axios.defaults.withCredentials = true;

    axios.interceptors.request.use((config) => {
      const token = localStorage.getItem("token");
      if (token) {
        config.headers.Authorization = `Bearer ${token}`;
      }
      return config;
    }, (error) => Promise.reject(error));

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [authMode, setAuthMode] = useState('login');
      
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [authError, setAuthError] = useState('');

      const [conversations, setConversations] = useState([]);
      const [currentChatId, setCurrentChatId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputMessage, setInputMessage] = useState('');
      const [sending, setSending] = useState(false);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      
      const messagesEndRef = useRef(null);

      useEffect(() => {
        checkAuth();
      }, []);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, sending]);

      const checkAuth = async () => {
        try {
          const res = await axios.get(`${API_BASE}/auth/me`);
          setUser(res.data.user);
          if (res.data.user) {
            fetchConversations();
          }
        } catch (err) {
          setUser(null);
          localStorage.removeItem("token");
        } finally {
          setLoading(false);
        }
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        try {
          const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
          const payload = authMode === 'login' 
            ? { email, password } 
            : { username, email, password };

          const res = await axios.post(`${API_BASE}${endpoint}`, payload);
          
          if (res.data.token) {
            localStorage.setItem("token", res.data.token);
          }

          setUser(res.data.user);
          if (res.data.user) {
            fetchConversations();
          }
        } catch (err) {
          setAuthError(err.response?.data?.message || 'حدث خطأ أثناء الاتصال بالخادم.');
        }
      };

      const handleLogout = async () => {
        try {
          await axios.post(`${API_BASE}/auth/logout`);
        } catch (err) {
          console.error(err);
        } finally {
          localStorage.removeItem("token");
          setUser(null);
          setConversations([]);
          setMessages([]);
          setCurrentChatId(null);
          setSidebarOpen(false);
        }
      };

      const fetchConversations = async () => {
        try {
          const res = await axios.get(`${API_BASE}/chat/conversations`);
          setConversations(res.data);
          if (res.data.length > 0 && !currentChatId) {
            selectConversation(res.data[0]._id);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const createNewChat = async () => {
        try {
          const res = await axios.post(`${API_BASE}/chat/conversations`);
          setConversations([res.data, ...conversations]);
          setCurrentChatId(res.data._id);
          setMessages([]);
          setSidebarOpen(false);
        } catch (err) {
          console.error(err);
        }
      };

      const selectConversation = async (id) => {
        setCurrentChatId(id);
        setSidebarOpen(false);
        try {
          const res = await axios.get(`${API_BASE}/chat/conversations/${id}/messages`);
          setMessages(res.data);
        } catch (err) {
          console.error(err);
        }
      };

      const deleteConversation = async (e, id) => {
        e.stopPropagation();
        try {
          await axios.delete(`${API_BASE}/chat/conversations/${id}`);
          const updated = conversations.filter(c => c._id !== id);
          setConversations(updated);
          if (currentChatId === id) {
            if (updated.length > 0) selectConversation(updated[0]._id);
            else { setCurrentChatId(null); setMessages([]); }
          }
        } catch (err) {
          console.error(err);
        }
      };

      const sendMessage = async (e) => {
        e.preventDefault();
        if (!inputMessage.trim() || sending || (user && user.messagesLeft <= 0)) return;

        let activeId = currentChatId;

        if (!activeId) {
          try {
            const res = await axios.post(`${API_BASE}/chat/conversations`);
            activeId = res.data._id;
            setCurrentChatId(activeId);
            setConversations([res.data, ...conversations]);
          } catch (err) {
            return;
          }
        }

        const userText = inputMessage;
        setInputMessage('');
        setMessages(prev => [...prev, { role: 'user', content: userText }]);
        setSending(true);

        try {
          const res = await axios.post(`${API_BASE}/chat/conversations/${activeId}/messages`, {
            message: userText
          });
          
          setMessages(prev => [...prev, { role: 'assistant', content: res.data.message }]);
          
          if (typeof res.data.messagesLeft !== 'undefined') {
            setUser(prev => ({ ...prev, messagesLeft: res.data.messagesLeft }));
          }
          fetchConversations();
        } catch (err) {
          const errMsg = err.response?.status === 403 
            ? (err.response?.data?.message || 'عذراً، لقد نفذ رصيد الرسائل المتاحة لك.')
            : 'حدث خطأ أثناء جلب الرد من Miss Mia.';
          setMessages(prev => [...prev, { role: 'assistant', content: errMsg }]);
        } finally {
          setSending(false);
        }
      };

      if (loading) {
        return (
          <div className="h-screen w-screen flex items-center justify-center bg-[#0f0a15]">
            <div className="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-pink-400 shadow-[0_0_20px_rgba(244,114,182,0.4)]"></div>
          </div>
        );
      }

      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#1d0e2b] via-[#0f0a15] to-[#08040d]">
            <div className="absolute -top-40 -left-40 w-80 h-80 sm:w-96 sm:h-96 bg-pink-500/15 rounded-full blur-3xl"></div>
            <div className="absolute -bottom-40 -right-40 w-80 h-80 sm:w-96 sm:h-96 bg-purple-600/15 rounded-full blur-3xl"></div>

            <div className="w-full max-w-md bg-[#160d21]/80 backdrop-blur-2xl border border-pink-500/20 rounded-3xl p-6 sm:p-8 shadow-[0_10px_40px_rgba(0,0,0,0.5)] relative z-10">
              <div className="text-center mb-6 sm:mb-8">
                <div className="inline-flex items-center justify-center w-14 h-14 sm:w-16 sm:h-16 bg-gradient-to-tr from-pink-500/20 to-purple-500/20 border border-pink-400/30 rounded-2xl mb-3 text-pink-300 text-2xl shadow-[0_0_25px_rgba(244,114,182,0.2)]">
                  <i className="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <h1 className="text-2xl sm:text-3xl font-bold text-white tracking-wide">Miss Mia <span className="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">AI</span></h1>
                <p className="text-pink-200/60 text-xs mt-1 sm:mt-2 tracking-wider">مساعدك الذكي للتحدث والتطوير</p>
              </div>

              {authError && (
                <div className="bg-rose-950/40 border border-rose-500/40 text-rose-300 px-4 py-3 rounded-2xl text-xs mb-6 flex items-center gap-2">
                  <i className="fa-solid fa-circle-exclamation text-rose-400"></i>
                  <span>{authError}</span>
                </div>
              )}

              <form onSubmit={handleAuth} className="space-y-4">
                {authMode === 'register' && (
                  <div>
                    <label className="block text-xs font-medium text-pink-200/80 mb-1 pr-1">اسم المستخدم</label>
                    <div className="relative">
                      <i className="fa-solid fa-user absolute right-4 top-3.5 text-pink-400/50 text-sm"></i>
                      <input 
                        type="text" 
                        required 
                        value={username} 
                        onChange={e => setUsername(e.target.value)}
                        placeholder="Mia_User"
                        className="w-full bg-[#0f0a15]/80 border border-purple-900/40 rounded-2xl py-2.5 pr-11 pl-4 text-sm text-pink-50 placeholder-pink-300/20 focus:outline-none focus:border-pink-400 transition-all shadow-inner"
                      />
                    </div>
                  </div>
                )}

                <div>
                  <label className="block text-xs font-medium text-pink-200/80 mb-1 pr-1">البريد الإلكتروني</label>
                  <div className="relative">
                    <i className="fa-solid fa-envelope absolute right-4 top-3.5 text-pink-400/50 text-sm"></i>
                    <input 
                      type="email" 
                      required 
                      value={email} 
                      onChange={e => setEmail(e.target.value)}
                      placeholder="name@example.com"
                      className="w-full bg-[#0f0a15]/80 border border-purple-900/40 rounded-2xl py-2.5 pr-11 pl-4 text-sm text-pink-50 placeholder-pink-300/20 focus:outline-none focus:border-pink-400 transition-all shadow-inner"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-medium text-pink-200/80 mb-1 pr-1">كلمة المرور</label>
                  <div className="relative">
                    <i className="fa-solid fa-lock absolute right-4 top-3.5 text-pink-400/50 text-sm"></i>
                    <input 
                      type="password" 
                      required 
                      value={password} 
                      onChange={e => setPassword(e.target.value)}
                      placeholder="••••••••"
                      className="w-full bg-[#0f0a15]/80 border border-purple-900/40 rounded-2xl py-2.5 pr-11 pl-4 text-sm text-pink-50 placeholder-pink-300/20 focus:outline-none focus:border-pink-400 transition-all shadow-inner"
                    />
                  </div>
                </div>

                <button 
                  type="submit" 
                  className="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-400 hover:to-purple-500 text-white font-semibold py-3 rounded-2xl shadow-[0_0_20px_rgba(244,114,182,0.3)] transition-all transform active:scale-[0.98] mt-2"
                >
                  {authMode === 'login' ? 'تسجيل الدخول' : 'إنشاء حساب جديد'}
                </button>
              </form>

              <div className="mt-6 text-center">
                <button 
                  onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); }}
                  className="text-xs text-pink-300/60 hover:text-pink-300 transition-colors"
                >
                  {authMode === 'login' ? 'ليس لديك حساب؟ قم بإنشاء حساب جديد' : 'لديك حساب بالفعل؟ قم بتسجيل الدخول'}
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-[#0f0a15] relative">
          
          {/* Overlay خلفية القائمة عند فتحها على الموبايل */}
          {sidebarOpen && (
            <div 
              onClick={() => setSidebarOpen(false)} 
              className="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 md:hidden transition-opacity"
            />
          )}

          {/* الشريط الجانبي */}
          <div className={`fixed md:relative z-40 h-full w-72 sm:w-80 bg-[#140c1f]/95 border-l border-purple-900/30 flex flex-col justify-between backdrop-blur-xl transition-transform duration-300 ${
            sidebarOpen ? 'translate-x-0' : 'translate-x-full md:translate-x-0'
          }`}>
            <div>
              <div className="p-4 border-b border-purple-900/30 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-pink-400 to-purple-600 border border-pink-300/30 flex items-center justify-center text-white shadow-[0_0_15px_rgba(244,114,182,0.3)]">
                    <i className="fa-solid fa-sparkles text-base"></i>
                  </div>
                  <div>
                    <h2 className="font-bold text-pink-50 text-base leading-none tracking-wide">Miss Mia</h2>
                    <span className="text-[10px] text-pink-400 font-medium tracking-wider">مساعدك الذكي ✨</span>
                  </div>
                </div>
                <button 
                  onClick={() => setSidebarOpen(false)}
                  className="md:hidden text-pink-300/60 hover:text-white p-1"
                >
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>
              </div>

              {/* شريط رصيد الرسائل المتبقية */}
              <div className="mx-4 mt-4 p-3 bg-purple-950/40 border border-pink-500/20 rounded-2xl flex items-center justify-between text-xs">
                <div className="flex items-center gap-2 text-pink-200">
                  <i className="fa-solid fa-comments text-pink-400"></i>
                  <span>الرسائل المتبقية:</span>
                </div>
                <span className={`font-bold px-2 py-0.5 rounded-full text-xs ${
                  user.messagesLeft > 0 ? 'bg-pink-500/20 text-pink-300 border border-pink-400/30' : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'
                }`}>
                  {user.messagesLeft ?? 0}
                </span>
              </div>

              <div className="p-4">
                <button 
                  onClick={createNewChat}
                  className="w-full bg-pink-500/10 hover:bg-pink-500/20 text-pink-200 border border-pink-500/30 font-medium py-2.5 px-4 rounded-2xl flex items-center justify-center gap-2 transition-all group shadow-sm text-xs"
                >
                  <i className="fa-solid fa-plus text-pink-400 group-hover:rotate-90 transition-transform"></i>
                  <span>محادثة جديدة</span>
                </button>
              </div>

              <div className="px-3 overflow-y-auto max-h-[calc(100vh-270px)] space-y-1">
                {conversations.map(chat => (
                  <div 
                    key={chat._id}
                    onClick={() => selectConversation(chat._id)}
                    className={`group flex items-center justify-between p-3 rounded-2xl cursor-pointer text-xs font-medium transition-all ${
                      currentChatId === chat._id 
                        ? 'bg-gradient-to-r from-purple-900/40 to-pink-900/30 border border-pink-500/40 text-pink-200 shadow-md' 
                        : 'text-pink-200/50 hover:bg-purple-900/20 hover:text-pink-100 border border-transparent'
                    }`}
                  >
                    <div className="flex items-center gap-2.5 truncate">
                      <i className="fa-regular fa-heart text-pink-400/60 group-hover:text-pink-400"></i>
                      <span className="truncate">{chat.title || 'محادثة جديدة'}</span>
                    </div>
                    <button 
                      onClick={(e) => deleteConversation(e, chat._id)}
                      className="opacity-0 group-hover:opacity-100 text-pink-300/40 hover:text-rose-400 p-1 transition-opacity"
                    >
                      <i className="fa-regular fa-trash-can"></i>
                    </button>
                  </div>
                ))}
              </div>
            </div>

            <div className="p-4 border-t border-purple-900/30 bg-[#0f0a15]/60 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-purple-800 to-pink-700 border border-pink-400/30 flex items-center justify-center text-pink-100 font-bold text-sm shadow-md">
                  {user.username.charAt(0).toUpperCase()}
                </div>
                <div className="overflow-hidden">
                  <h4 className="text-xs font-semibold text-pink-100 truncate">{user.username}</h4>
                  <p className="text-[10px] text-pink-300/40 truncate">{user.email}</p>
                </div>
              </div>
              <button 
                onClick={handleLogout}
                title="تسجيل الخروج"
                className="text-pink-300/40 hover:text-rose-400 p-2 rounded-xl transition-colors"
              >
                <i className="fa-solid fa-right-from-bracket"></i>
              </button>
            </div>
          </div>

          {/* منطقة المحادثة الرئيسية */}
          <div className="flex-1 flex flex-col h-full bg-[#0f0a15] relative w-full">
            <div className="h-16 border-b border-purple-900/30 bg-[#140c1f]/50 px-4 sm:px-6 flex items-center justify-between backdrop-blur-md z-10">
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setSidebarOpen(true)}
                  className="md:hidden text-pink-200 hover:text-white p-2 rounded-xl bg-purple-950/40 border border-purple-800/40"
                >
                  <i className="fa-solid fa-bars text-sm"></i>
                </button>

                <div className="relative">
                  <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-gradient-to-tr from-pink-400 to-purple-500 flex items-center justify-center text-white text-sm sm:text-base shadow-[0_0_15px_rgba(244,114,182,0.4)]">
                    <i className="fa-solid fa-wand-magic-sparkles"></i>
                  </div>
                  <span className="absolute bottom-0 left-0 w-2.5 h-2.5 bg-emerald-400 border-2 border-[#0f0a15] rounded-full"></span>
                </div>
                <div>
                  <h3 className="text-xs sm:text-sm font-bold text-pink-50 flex items-center gap-2">
                    Miss Mia
                    <span className="bg-pink-500/10 border border-pink-400/30 text-pink-300 text-[9px] sm:text-[10px] font-medium px-2 py-0.5 rounded-full">Smart AI 🌸</span>
                  </h3>
                  <p className="text-[10px] sm:text-[11px] text-pink-300/50">مساعدك الشخصي الذكي</p>
                </div>
              </div>

              {/* رصيد الرسائل الشفاف أعلى المحادثة للجوال */}
              <div className="flex items-center gap-2">
                <span className="text-[11px] text-pink-200/70 bg-purple-950/50 border border-pink-500/20 px-3 py-1 rounded-full">
                  الرصيد: <strong className="text-pink-300">{user.messagesLeft ?? 0}</strong>
                </span>
                <button onClick={createNewChat} className="p-2 text-pink-200 hover:text-white md:hidden">
                  <i className="fa-solid fa-plus"></i>
                </button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 sm:space-y-6">
              {messages.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-center p-4 max-w-lg mx-auto">
                  <div className="w-14 h-14 sm:w-16 sm:h-16 bg-gradient-to-tr from-pink-500/10 to-purple-500/10 border border-pink-400/20 rounded-3xl flex items-center justify-center text-pink-300 text-2xl mb-4 shadow-[0_0_30px_rgba(244,114,182,0.15)]">
                    <i className="fa-solid fa-wand-magic-sparkles"></i>
                  </div>
                  <h3 className="text-lg sm:text-xl font-bold text-pink-50">كيف يمكنني مساعدتك اليوم؟</h3>
                  <p className="text-pink-200/50 text-xs mt-2 leading-relaxed">
                    أهلاً بك! أنا Miss Mia، جاهزة لمساعدتك في الإجابة عن الأسئلة، والأفكار، وتطوير مشاريعك.
                  </p>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-6 w-full text-xs">
                    <button 
                      onClick={() => setInputMessage('ساعدني في التخطيط لمشروع جديد')}
                      className="p-3.5 bg-[#160d21]/80 hover:bg-purple-900/30 border border-purple-900/40 rounded-2xl text-pink-200 text-right transition-all hover:border-pink-400/40 shadow-sm"
                    >
                      🌸 خطة مشروع جديد
                    </button>
                    <button 
                      onClick={() => setInputMessage('اشرح لي مفاهيم البرمجة بشكل مبسط')}
                      className="p-3.5 bg-[#160d21]/80 hover:bg-purple-900/30 border border-purple-900/40 rounded-2xl text-pink-200 text-right transition-all hover:border-pink-400/40 shadow-sm"
                    >
                      ✨ شرح المفاهيم المعقدة
                    </button>
                  </div>
                </div>
              ) : (
                messages.map((msg, idx) => (
                  <div 
                    key={idx} 
                    className={`flex items-start gap-2.5 sm:gap-3 max-w-3xl ${msg.role === 'user' ? 'mr-auto flex-row-reverse' : 'ml-auto'}`}
                  >
                    <div className={`w-7 h-7 sm:w-8 sm:h-8 rounded-full flex items-center justify-center text-xs shrink-0 ${
                      msg.role === 'user' 
                        ? 'bg-purple-950 text-pink-200 border border-purple-800/50' 
                        : 'bg-gradient-to-br from-pink-400 to-purple-500 text-white shadow-md'
                    }`}>
                      <i className={`fa-solid ${msg.role === 'user' ? 'fa-user' : 'fa-wand-magic-sparkles'}`}></i>
                    </div>

                    <div className={`p-3.5 sm:p-4 rounded-3xl text-xs sm:text-sm leading-relaxed ${
                      msg.role === 'user'
                        ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white font-normal rounded-tl-none shadow-md'
                        : 'bg-[#160d21] border border-purple-900/30 text-pink-50 rounded-tr-none shadow-md'
                    }`}>
                      <p className="whitespace-pre-wrap">{msg.content}</p>
                    </div>
                  </div>
                ))
              )}

              {sending && (
                <div className="flex items-start gap-3 max-w-3xl ml-auto">
                  <div className="w-8 h-8 rounded-full bg-gradient-to-br from-pink-400 to-purple-500 text-white flex items-center justify-center text-xs shrink-0 shadow-md">
                    <i className="fa-solid fa-wand-magic-sparkles"></i>
                  </div>
                  <div className="bg-[#160d21] border border-purple-900/30 text-pink-300/60 p-4 rounded-3xl rounded-tr-none text-xs flex items-center gap-2">
                    <div className="w-2 h-2 bg-pink-400 rounded-full animate-ping"></div>
                    <span>Miss Mia تفكر الآن...</span>
                  </div>
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>

            {/* إدخال الرسائل / حالة انتهاء الرصيد */}
            <div className="p-3 sm:p-4 border-t border-purple-900/30 bg-[#140c1f]/50 backdrop-blur-md">
              {user.messagesLeft <= 0 ? (
                <div className="max-w-4xl mx-auto bg-rose-950/30 border border-rose-500/30 text-rose-300 p-3 sm:p-4 rounded-2xl text-center text-xs flex items-center justify-center gap-2">
                  <i className="fa-solid fa-circle-exclamation text-rose-400 text-sm"></i>
                  <span>لقد استهلكت جميع الرسائل الـ 10 المتاحة لك. للتجديد يرجى التواصل مع الإدارة.</span>
                </div>
              ) : (
                <form onSubmit={sendMessage} className="max-w-4xl mx-auto relative flex items-center">
                  <input 
                    type="text" 
                    value={inputMessage} 
                    onChange={e => setInputMessage(e.target.value)}
                    placeholder="اسأل Miss Mia أي شيء..."
                    className="w-full bg-[#160d21] border border-purple-900/40 focus:border-pink-400/60 rounded-full py-3 sm:py-3.5 pr-4 pl-12 sm:pl-14 text-xs sm:text-sm text-pink-50 placeholder-pink-300/30 focus:outline-none transition-all shadow-inner"
                  />
                  <button 
                    type="submit" 
                    disabled={!inputMessage.trim() || sending}
                    className="absolute left-2 w-8 h-8 sm:w-9 sm:h-9 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-400 hover:to-purple-500 disabled:bg-purple-950 disabled:text-pink-300/20 text-white rounded-full flex items-center justify-center transition-all shadow-[0_0_12px_rgba(244,114,182,0.3)]"
                  >
                    <i className="fa-solid fa-paper-plane text-xs"></i>
                  </button>
                </form>
              )}
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
